{% extends "base.html" %}

{% block content %}

<h3>Add Customer</h3>

<form method="POST" enctype="multipart/form-data">

<div class="mb-3">
<label>Name</label>
<input type="text" name="name" class="form-control" required>
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text" name="phone" placeholder="+254712345678" class="form-control" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<button class="btn btn-primary">Add Customer</button>

</form>

{% endblock %}
