{% extends "base.html" %}

{% block content %}

<h3>Customers</h3>

<table class="table table-striped">

<thead>

<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
</tr>

</thead>

<tbody>

{% for customer in customers %}

<tr>

<td>{{ customer.name }}</td>
<td>{{ customer.email }}</td>
<td>{{ customer.phone }}</td>

<td>

{% if session['role'] in ['superadmin', 'tech'] %}
<a href="{{ url_for('edit_customer', id=customer.id) }}" class="btn btn-warning btn-sm">
    Edit
</a>

<form method="POST" action="{{ url_for('delete_customer', id=customer.id) }}">
    <button class="btn btn-danger btn-sm">Delete</button>
</form>
{% endif %}


</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
