{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:400px;">

<h3>Set New Password</h3>

<form method="POST">

    <input type="password"
           name="password"
           class="form-control mb-3"
           placeholder="New password"
           required>

    <button class="btn btn-success w-100">
        Update Password
    </button>

</form>

</div>

{% endblock %}
