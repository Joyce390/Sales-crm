{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:400px;">

<h3>Reset Password</h3>

<form method="POST">

    <input type="email"
           name="email"
           class="form-control mb-3"
           placeholder="Enter your email"
           required>

    <button class="btn btn-primary w-100">
        Send Reset Link
    </button>

</form>

</div>

{% endblock %}
